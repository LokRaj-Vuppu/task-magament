<!doctype html>
<html>
  <body style="margin: 0; padding: 0; background: #eef2f7; font-family: Arial">
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 40px">
          <table
            width="650"
            style="
              background: white;
              border-radius: 16px;
              overflow: hidden;
              box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            "
          >
            <tr>
              <td
                style="
                  padding: 35px;
                  text-align: center;
                  background: linear-gradient(135deg, #dc2626, #ef4444);
                  color: white;
                "
              >
                <h1>🗑️ Task Deleted</h1>

                <p>The task has been removed</p>
              </td>
            </tr>

            <tr>
              <td style="padding: 35px">
                <h2>Hello {{name}},</h2>

                <p style="line-height: 1.8; color: #666">
                  The following task was deleted successfully.
                </p>

                <div
                  style="
                    background: #fff1f2;
                    padding: 25px;
                    border-left: 5px solid #ef4444;
                    border-radius: 12px;
                  "
                >
                  <h3 style="color: #dc2626">Deleted Task Details</h3>

                  <p><strong>Task:</strong> {{task_title}}</p>

                  <p><strong>Description:</strong> {{task_description}}</p>

                  <p><strong>Priority:</strong> {{priority}}</p>

                  <p><strong>Status:</strong> {{status}}</p>
                </div>

                <p style="margin-top: 25px; color: #777; font-size: 14px">
                  If this deletion wasn't intended, contact support.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
